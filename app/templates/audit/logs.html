{% extends "base.html" %}

{% block header_title %}Audit Logs{% endblock %}

{% block content %}
<!-- Header Bar -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
        <div class="flex items-center space-x-2.5">
            <h2 class="text-lg font-bold font-heading text-slate-900 tracking-tight">Security & Activity Audit Trail</h2>
            <span class="px-2 py-0.5 rounded-md text-xs font-mono font-semibold bg-teal-50 text-teal-700 border border-teal-200" id="audit-count-badge">
                {{ page_data.total_records }}
            </span>
        </div>
    </div>

    <div class="flex items-center space-x-2">
        <button type="button" onclick="exportAuditLogs()" class="inline-flex items-center px-3.5 py-2 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 bg-white hover:bg-slate-50 transition-colors shadow-xs cursor-pointer" title="Export Audit Logs as Excel Spreadsheet">
            <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5 mr-1.5 text-emerald-600"></i>
            <span>Export Excel</span>
        </button>
    </div>
</div>

<!-- Search & Filter Controls -->
<div class="bg-white rounded-xl p-3 sm:p-4 border border-slate-200 shadow-sm flex flex-col lg:flex-row gap-3 items-stretch lg:items-center justify-between">
    <!-- Search Input with HTMX -->
    <div class="relative flex-1 min-w-[240px]">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="search" class="w-4 h-4"></i>
        </div>
        <input type="text" id="auditSearch" name="q" value="{{ q }}"
            hx-get="/audit"
            hx-trigger="keyup changed delay:300ms, search"
            hx-target="#auditTableContainer"
            hx-include="#auditDateFilter, #auditActionFilter"
            hx-push-url="true"
            placeholder="Search by actor email, action, or entity..."
            class="w-full pl-9 pr-3.5 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-lg text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-teal-600 focus:ring-1 focus:ring-teal-600 transition-colors">
    </div>

    <div class="flex flex-wrap items-center gap-2.5 sm:gap-3">
        <!-- Calendar Date Picker with HTMX -->
        <div class="flex items-center space-x-2 bg-slate-50 border border-slate-200/90 rounded-lg px-2.5 py-1">
            <label for="auditDateFilter" class="text-[11px] font-bold text-slate-600 uppercase tracking-wider shrink-0 flex items-center space-x-1">
                <i data-lucide="calendar" class="w-3.5 h-3.5 text-teal-600"></i>
                <span>Date:</span>
            </label>
            <div class="relative flex items-center">
                <input type="date" id="auditDateFilter" name="date" value="{{ date }}"
                    hx-get="/audit"
                    hx-trigger="change"
                    hx-target="#auditTableContainer"
                    hx-include="#auditSearch, #auditActionFilter"
                    hx-push-url="true"
                    onchange="toggleAuditClearBtn(this.value)"
                    class="py-1 px-2 text-xs bg-white border border-slate-200 rounded-md text-slate-900 font-mono focus:outline-none focus:border-teal-600 focus:ring-1 focus:ring-teal-600 shadow-2xs">
                <button type="button" id="clearAuditDateBtn" onclick="clearAuditDateFilter()" title="Clear date selection" class="{% if not date %}hidden{% endif %} ml-1.5 p-1 text-slate-400 hover:text-rose-600 rounded hover:bg-rose-50 transition-colors">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
            </div>
            <button type="button" onclick="setTodayAuditDateFilter()" title="Select Today" class="px-2 py-0.5 rounded text-[11px] font-bold text-teal-800 bg-teal-100/70 hover:bg-teal-200/80 border border-teal-300/70 transition-colors cursor-pointer shadow-2xs">
                Today
            </button>
        </div>

        <!-- Action Type Filter with HTMX -->
        <div class="flex items-center space-x-2 bg-slate-50 border border-slate-200/90 rounded-lg px-2.5 py-1">
            <label for="auditActionFilter" class="text-[11px] font-bold text-slate-600 uppercase tracking-wider shrink-0">Action:</label>
            <select id="auditActionFilter" name="action"
                hx-get="/audit"
                hx-trigger="change"
                hx-target="#auditTableContainer"
                hx-include="#auditSearch, #auditDateFilter"
                hx-push-url="true"
                class="py-1 px-2 text-xs bg-white border border-slate-200 rounded-md text-slate-900 font-medium focus:outline-none focus:border-teal-600 shadow-2xs">
                <option value="all" {% if action == 'all' %}selected{% endif %}>All Actions</option>
                <option value="PASSWORD" {% if action == 'PASSWORD' %}selected{% endif %}>Password</option>
                <option value="ROLE" {% if action == 'ROLE' %}selected{% endif %}>Role & Permissions</option>
                <option value="DELETE" {% if action == 'DELETE' %}selected{% endif %}>Deletions</option>
                <option value="CREATE" {% if action == 'CREATE' %}selected{% endif %}>Creations</option>
                <option value="UPDATE" {% if action == 'UPDATE' %}selected{% endif %}>Updates</option>
            </select>
        </div>
    </div>
</div>

<!-- Audit Log Table Card -->
<div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden" id="auditTableCard">
    {% include "audit/partials/_logs_table.html" %}
</div>

<script>
    function toggleAuditClearBtn(val) {
        const btn = document.getElementById('clearAuditDateBtn');
        if (btn) {
            if (val) {
                btn.classList.remove('hidden');
            } else {
                btn.classList.add('hidden');
            }
        }
    }

    function setTodayAuditDateFilter() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const todayStr = `${year}-${month}-${day}`;

        const dateInput = document.getElementById('auditDateFilter');
        if (dateInput) {
            dateInput.value = todayStr;
            toggleAuditClearBtn(todayStr);
            htmx.trigger(dateInput, 'change');
        }
    }

    function clearAuditDateFilter() {
        const dateInput = document.getElementById('auditDateFilter');
        if (dateInput) {
            dateInput.value = '';
            toggleAuditClearBtn('');
            htmx.trigger(dateInput, 'change');
        }
    }

    function exportAuditLogs() {
        const q = encodeURIComponent(document.getElementById('auditSearch')?.value || '');
        const date = encodeURIComponent(document.getElementById('auditDateFilter')?.value || '');
        const action = encodeURIComponent(document.getElementById('auditActionFilter')?.value || 'all');
        window.location.href = `/audit/export-excel?q=${q}&date=${date}&action=${action}`;
    }
</script>
{% endblock %}
