{% extends "base.html" %}

{% block header_title %}Company Profile{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 max-w-2xl">
    <div class="p-6 border-b border-gray-100">
        <h3 class="text-lg font-semibold text-gray-800">Company Settings</h3>
        <p class="text-sm text-gray-500 mt-1">Update your company details and global preferences here.</p>
    </div>
    
    <div class="p-6">
        <form action="/company/profile" method="POST" class="space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">Company Name</label>
                    <input type="text" name="name" id="name" value="{{ company.name }}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                
                <div>
                    <label for="currency_symbol" class="block text-sm font-medium text-gray-700">Currency Symbol</label>
                    <input type="text" name="currency_symbol" id="currency_symbol" value="{{ company.currency_symbol }}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
            </div>
            
            <div>
                <label for="address" class="block text-sm font-medium text-gray-700">Address</label>
                <textarea id="address" name="address" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">{{ company.address }}</textarea>
            </div>
            
            <div>
                <label for="working_days_per_month" class="block text-sm font-medium text-gray-700">Working Days Per Month</label>
                <input type="number" name="working_days_per_month" id="working_days_per_month" value="{{ company.working_days_per_month }}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                <p class="mt-2 text-sm text-gray-500">Used for pro-rata salary calculations.</p>
            </div>
            
            <div class="flex justify-end pt-4">
                <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
