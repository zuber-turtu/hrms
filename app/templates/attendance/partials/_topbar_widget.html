{% if user and user.role == 'super_admin' %}
    <div class="inline-flex items-center px-2.5 py-1.5 rounded-xl bg-gradient-to-r from-purple-100 to-indigo-50 border border-purple-200/80 text-purple-900 text-xs font-bold space-x-1.5 shadow-2xs">
        <i data-lucide="crown" class="w-4 h-4 text-amber-500 fill-amber-400 shrink-0"></i>
        <span class="font-heading hidden sm:inline">Super Admin</span>
        <span class="font-heading sm:hidden">Super</span>
    </div>
{% elif user %}
{% if request.state.is_checked_in %}
    <div class="flex items-center space-x-1.5 sm:space-x-2">
        {% if request.state.is_lunch_window %}
        <!-- Lunch Break Check Out (Active during configured Lunch Window) -->
        <button id="lunch-checkout-btn" 
                onclick="triggerPunch(this, '/attendance/check-out', {punch_reason: 'lunch'})"
                type="button" 
                title="Go for Lunch Break ({{ request.state.lunch_start_str }} - {{ request.state.lunch_end_str }})"
                class="inline-flex items-center px-2 py-1.5 sm:px-3 sm:py-2 border border-amber-400/40 text-xs sm:text-sm font-bold rounded-lg text-amber-950 bg-amber-400 hover:bg-amber-300 shadow-xs hover:shadow transition-all active:scale-[0.98] cursor-pointer shrink-0 animate-pulse">
            <span class="mr-1.5">🍱</span>
            <span class="hidden sm:inline">Go for Lunch</span>
            <span class="sm:hidden">Lunch</span>
        </button>
        {% endif %}

        <!-- Standard Shift Check Out -->
        <button id="checkout-btn" 
                onclick="triggerPunch(this, '/attendance/check-out')"
                data-checkin-time="{{ request.state.active_check_in_iso if request.state.active_check_in_iso else request.state.active_check_in.isoformat() + '+05:30' }}" 
                data-accumulated-seconds="{{ request.state.accumulated_seconds }}" 
                type="button" 
                class="inline-flex items-center px-2.5 py-1.5 sm:px-3.5 sm:py-2 border border-rose-600/30 text-xs sm:text-sm font-semibold rounded-lg text-white bg-[#E53E3E] hover:bg-[#C53030] shadow-xs hover:shadow transition-all active:scale-[0.98] group cursor-pointer shrink-0">
            <span class="w-2 h-2 rounded-full bg-rose-200 mr-1.5 animate-pulse shrink-0"></span>
            <i data-lucide="log-out" class="w-3.5 h-3.5 mr-1 text-rose-100 shrink-0"></i>
            <span class="hidden xs:inline">Check Out</span>
            <span class="xs:hidden">Out</span>
            <span class="hidden md:inline ml-1 text-rose-200 text-xs font-normal">({{ request.state.active_check_in.strftime('%I:%M %p') }})</span>
            <span id="active-timer" class="ml-1.5 sm:ml-2 px-1.5 py-0.5 rounded text-[10px] sm:text-[11px] bg-[#004444] text-[#E0F4F4] font-mono tracking-wider">00:00:00</span>
        </button>
    </div>
{% else %}
    <div class="inline-block">
        {% if request.state.is_on_lunch_break %}
        <!-- Lunch Break Return (Resume from Lunch) -->
        <button id="lunch-checkin-btn"
                onclick="triggerPunch(this, '/attendance/check-in', {punch_reason: 'lunch_return'})"
                type="button" 
                title="Return from Lunch Break ({{ request.state.lunch_start_str }} - {{ request.state.lunch_end_str }})"
                class="inline-flex items-center px-2.5 py-1.5 sm:px-3.5 sm:py-2 border border-amber-500/40 text-xs sm:text-sm font-bold rounded-lg text-white bg-amber-600 hover:bg-amber-700 shadow-xs hover:shadow transition-all active:scale-[0.98] group cursor-pointer shrink-0">
            <span class="mr-1.5">🍱</span>
            <span>Return from Lunch</span>
            {% if request.state.accumulated_seconds > 0 %}
                <span class="hidden lg:inline ml-1.5 text-xs text-amber-100 font-normal">({{ request.state.accumulated_time_str }})</span>
            {% endif %}
        </button>
        {% else %}
        <!-- Standard Shift Check In -->
        <button id="checkin-btn"
                onclick="triggerPunch(this, '/attendance/check-in')"
                type="button" 
                class="inline-flex items-center px-2.5 py-1.5 sm:px-3.5 sm:py-2 border border-[#008080]/30 text-xs sm:text-sm font-semibold rounded-lg text-white bg-[#008080] hover:bg-[#006666] shadow-xs hover:shadow transition-all active:scale-[0.98] group cursor-pointer shrink-0">
            <i data-lucide="log-in" class="w-3.5 h-3.5 mr-1 text-white/90 shrink-0"></i>
            <span>Check In</span>
            {% if request.state.accumulated_seconds > 0 %}
                <span class="hidden lg:inline ml-1.5 text-xs text-teal-100 font-normal">(Today: {{ request.state.accumulated_time_str }})</span>
            {% elif request.state.last_check_out %}
                <span class="hidden lg:inline ml-1.5 text-xs text-teal-100 font-normal">(Last: {{ request.state.last_check_out.strftime('%I:%M %p') }})</span>
            {% endif %}
        </button>
        {% endif %}
    </div>
{% endif %}
{% endif %}
