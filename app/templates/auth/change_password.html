{% extends "base.html" %}

{% block header_title %}Change Password{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 max-w-md mx-auto">
    <div class="p-6 border-b border-gray-100">
        <h3 class="text-lg font-semibold text-gray-800">Update Security Credentials</h3>
        <p class="text-sm text-gray-500 mt-1">To change your password, please confirm your old password first.</p>
    </div>
    
    <div class="p-6">
        {% if error %}
        <div class="mb-4 bg-red-50 border-l-4 border-red-500 p-4 rounded-r-md">
            <div class="flex">
                <div class="flex-shrink-0">
                    <i data-lucide="alert-circle" class="h-5 w-5 text-red-400"></i>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-red-700 font-medium">{{ error }}</p>
                </div>
            </div>
        </div>
        {% endif %}

        {% if success %}
        <div class="mb-4 bg-green-50 border-l-4 border-green-500 p-4 rounded-r-md">
            <div class="flex">
                <div class="flex-shrink-0">
                    <i data-lucide="check-circle" class="h-5 w-5 text-green-400"></i>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-green-700 font-medium">{{ success }}</p>
                </div>
            </div>
        </div>
        {% endif %}

        <form action="/change-password" method="POST" class="space-y-6">
            <div>
                <label for="old_password" class="block text-sm font-medium text-gray-700">Current Password</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="key-round" class="h-5 w-5 text-gray-400"></i>
                    </div>
                    <input type="password" name="old_password" id="old_password" required class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-2.5 border" placeholder="••••••••">
                </div>
            </div>

            <div>
                <label for="new_password" class="block text-sm font-medium text-gray-700">New Password</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="lock" class="h-5 w-5 text-gray-400"></i>
                    </div>
                    <input type="password" name="new_password" id="new_password" minlength="6" required class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-2.5 border" placeholder="••••••••">
                </div>
            </div>

            <div>
                <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    Update Password
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
