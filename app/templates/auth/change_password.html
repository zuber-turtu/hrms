{% extends "base.html" %}

{% block header_title %}Security Settings{% endblock %}

{% block content %}
<div class="max-w-md mx-auto space-y-6">
    
    <!-- Security Card -->
    <div class="bg-white rounded-2xl border border-[#B3E3E3]/60 shadow-sm p-6 sm:p-8">
        <div class="flex items-center space-x-3 pb-4 border-b border-[#B3E3E3]/40 mb-6">
            <div class="w-10 h-10 rounded-xl bg-[#E0F4F4] text-[#008080] flex items-center justify-center border border-[#B3E3E3]">
                <i data-lucide="shield-check" class="w-5 h-5"></i>
            </div>
            <div>
                <h3 class="text-base font-bold font-heading text-[#1C2B2B]">Reset Password</h3>
                <p class="text-xs text-[#6B7F7F]">Enter a new password for your account</p>
            </div>
        </div>
        
        {% if error %}
        <div class="mb-5 bg-rose-50 border border-rose-200 rounded-xl p-3.5 flex items-start space-x-3">
            <div class="p-1 rounded-full bg-rose-100 text-rose-600 shrink-0">
                <i data-lucide="alert-circle" class="w-4 h-4"></i>
            </div>
            <div class="text-xs font-semibold text-rose-700">
                {{ error }}
            </div>
        </div>
        {% endif %}

        {% if success %}
        <div class="mb-5 bg-emerald-50 border border-emerald-200 rounded-xl p-3.5 flex items-start space-x-3">
            <div class="p-1 rounded-full bg-emerald-100 text-emerald-600 shrink-0">
                <i data-lucide="check-circle" class="w-4 h-4"></i>
            </div>
            <div class="text-xs font-semibold text-emerald-700">
                {{ success }}
            </div>
        </div>
        {% endif %}

        <form action="/change-password" method="POST" class="space-y-4">
            <div>
                <label for="new_password" class="block text-xs font-semibold text-[#1C2B2B] uppercase tracking-wider mb-1.5">New Password <span class="text-rose-500">*</span></label>
                <div class="relative rounded-lg shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#6B7F7F]">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </div>
                    <input type="password" name="new_password" id="new_password" minlength="6" required placeholder="Minimum 6 characters" class="w-full text-sm bg-[#F4F7F7] border border-[#B3E3E3] rounded-lg pl-10 pr-3.5 py-2.5 text-[#1C2B2B] placeholder-[#6B7F7F] focus:bg-white focus:outline-none focus:border-[#008080] focus:ring-1 focus:ring-[#008080] transition-colors">
                </div>
                <p class="text-[11px] text-[#6B7F7F] mt-1">Must be at least 6 characters in length.</p>
            </div>

            <div class="pt-3">
                <button type="submit" class="w-full flex items-center justify-center py-2.5 px-4 rounded-xl text-sm font-semibold text-white bg-[#008080] hover:bg-[#006666] shadow-md shadow-[#008080]/20 transition-all active:scale-[0.98]">
                    <i data-lucide="check" class="w-4 h-4 mr-2"></i> Update Password
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
