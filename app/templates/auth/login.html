<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Dynamic HRMS Enterprise</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/images/logo.png">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="h-full flex items-center justify-center p-4 sm:p-6 bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 font-sans antialiased text-slate-800">

    <div class="w-full max-w-md">
        
        <!-- App Logo & Branding Header -->
        <div class="text-center mb-8">
            <img src="/static/images/logo.png" alt="Company Logo" class="w-16 h-16 object-contain rounded-2xl bg-white/95 p-2 mb-4 shadow-xl ring-4 ring-white/10 mx-auto">
            <h1 class="text-2xl font-extrabold text-white tracking-tight">HRMS<span class="text-blue-400">Portal</span></h1>
            <p class="text-xs text-slate-400 mt-1">Enterprise Human Resource Management System</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-7 sm:p-8 border border-slate-100">
            <div class="mb-6">
                <h2 class="text-lg font-bold text-slate-900">Sign in to your account</h2>
                <p class="text-xs text-slate-500 mt-0.5">Please enter your company email and password.</p>
            </div>
            
            {% if error %}
            <div class="mb-5 bg-rose-50 border border-rose-200 rounded-xl p-3.5 flex items-start space-x-3">
                <div class="p-1 rounded-full bg-rose-100 text-rose-600 shrink-0">
                    <i data-lucide="alert-circle" class="w-4 h-4"></i>
                </div>
                <div class="text-xs font-semibold text-rose-700">
                    {{ error }}
                </div>
            </div>
            {% endif %}

            {% if success %}
            <div class="mb-5 bg-emerald-50 border border-emerald-200 rounded-xl p-3.5 flex items-start space-x-3">
                <div class="p-1 rounded-full bg-emerald-100 text-emerald-600 shrink-0">
                    <i data-lucide="check-circle" class="w-4 h-4"></i>
                </div>
                <div class="text-xs font-semibold text-emerald-700">
                    {{ success }}
                </div>
            </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-4">
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Email address</label>
                    <div class="relative rounded-lg shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </div>
                        <input type="email" name="email" id="email" required placeholder="admin@hrms.local" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-lg pl-10 pr-3.5 py-2.5 text-slate-900 focus:bg-white focus:outline-none focus:border-blue-500 transition-colors">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
                    <div class="relative rounded-lg shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input type="password" name="password" id="password" required placeholder="••••••••" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-lg pl-10 pr-10 py-2.5 text-slate-900 focus:bg-white focus:outline-none focus:border-blue-500 transition-colors">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                            <i data-lucide="eye" id="password-toggle-icon" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full flex items-center justify-center py-2.5 px-4 rounded-xl text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 shadow-md shadow-blue-600/25 transition-all active:scale-[0.98]">
                        <i data-lucide="log-in" class="w-4 h-4 mr-2"></i> Sign In
                    </button>
                </div>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-100 text-center">
                <p class="text-[11px] text-slate-400">
                    Default Administrator: <span class="font-mono text-slate-600">admin@hrms.local / Admin@123</span>
                </p>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                passInput.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
