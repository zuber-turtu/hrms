<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - TURTU HRMS</title>
    
    <!-- Google Fonts: Nunito (UI/Body), Poppins (Headings/Brand), JetBrains Mono (Code/Numbers), Noto Sans Kannada -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;700&family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Nunito"', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        heading: ['"Poppins"', '"Nunito"', 'sans-serif'],
                        display: ['"Poppins"', '"Nunito"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                        kannada: ['"Noto Sans Kannada"', '"Nunito"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#F4F7F7',
                            100: '#E0F4F4',
                            200: '#B3E3E3',
                            300: '#80C7C7',
                            400: '#4DB8B8',
                            500: '#008080',
                            600: '#006666',
                            700: '#005050',
                            800: '#004444',
                            900: '#1C2B2B',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Favicon / Tab Icon -->
    <link rel="icon" type="image/jpeg" href="/static/images/icon.jpeg">
    <link rel="shortcut icon" type="image/jpeg" href="/static/images/icon.jpeg">
    <link rel="apple-touch-icon" href="/static/images/icon.jpeg">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="h-full flex items-center justify-center p-4 sm:p-6 bg-slate-900 font-sans antialiased text-slate-900">

    <div class="w-full max-w-md">
        
        <!-- App Logo & Branding Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center p-1.5 bg-slate-800 border border-slate-700 rounded-2xl shadow-xl mb-3.5">
                <img src="/static/images/icon.jpeg" alt="TURTU Logo" class="w-12 h-12 object-contain rounded-xl">
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight font-heading">TURTU <span class="text-teal-400">HRMS</span></h1>
            <p class="text-xs text-slate-400 mt-1">Enterprise Human Resource Management System</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-xl shadow-2xl p-7 sm:p-8 border border-slate-200">
            <div class="mb-6 pb-4 border-b border-slate-100">
                <h2 class="text-base font-bold text-slate-900 font-heading">Sign in to your account</h2>
                <p class="text-xs text-slate-500 mt-0.5">Enter your corporate credentials to continue</p>
            </div>
            
            {% if error %}
            <div class="mb-4 bg-rose-50 border border-rose-200 rounded-lg p-3 flex items-start space-x-2.5">
                <div class="p-0.5 rounded text-rose-600 shrink-0">
                    <i data-lucide="alert-circle" class="w-4 h-4"></i>
                </div>
                <div class="text-xs font-semibold text-rose-700">
                    {{ error }}
                </div>
            </div>
            {% endif %}

            {% if success %}
            <div class="mb-4 bg-emerald-50 border border-emerald-200 rounded-lg p-3 flex items-start space-x-2.5">
                <div class="p-0.5 rounded text-emerald-600 shrink-0">
                    <i data-lucide="check-circle" class="w-4 h-4"></i>
                </div>
                <div class="text-xs font-semibold text-emerald-700">
                    {{ success }}
                </div>
            </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-4">
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Work Email</label>
                    <div class="relative rounded-lg">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </div>
                        <input type="email" name="email" id="email" required placeholder="name@company.com" class="w-full text-xs sm:text-sm bg-white border border-slate-300 rounded-lg pl-9 pr-3.5 py-2 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-1 focus:ring-teal-600 transition-colors">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Password</label>
                    </div>
                    <div class="relative rounded-lg">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input type="password" name="password" id="password" required placeholder="••••••••" class="w-full text-xs sm:text-sm bg-white border border-slate-300 rounded-lg pl-9 pr-9 py-2 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-1 focus:ring-teal-600 transition-colors">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                            <i data-lucide="eye" id="password-toggle-icon" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full flex items-center justify-center py-2 px-4 rounded-lg text-xs sm:text-sm font-semibold text-white bg-teal-600 hover:bg-teal-700 shadow-sm transition-colors active:scale-[0.98]">
                        <i data-lucide="log-in" class="w-4 h-4 mr-2"></i> Sign In to Portal
                    </button>
                </div>
            </form>
        </div>

        <div class="text-center mt-6">
            <p class="text-[11px] text-slate-400">© 2026 TURTU HRMS. Authenticated Session Protected.</p>
        </div>

    </div>

    <script>
        lucide.createIcons();

        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                passInput.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
