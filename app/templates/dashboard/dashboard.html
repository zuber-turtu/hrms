{% extends "base.html" %}

{% block header_title %}Dashboard{% endblock %}

{% block content %}
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex items-center">
        <div class="p-4 rounded-full bg-blue-50 text-blue-600 mr-4">
            <i data-lucide="users" class="w-8 h-8"></i>
        </div>
        <div>
            <p class="text-sm font-medium text-gray-500">Welcome</p>
            <h3 class="text-xl font-bold text-gray-900">{{ user.first_name }} {{ user.last_name }}</h3>
        </div>
    </div>
    
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex items-center">
        <div class="p-4 rounded-full bg-green-50 text-green-600 mr-4">
            <i data-lucide="check-circle" class="w-8 h-8"></i>
        </div>
        <div>
            <p class="text-sm font-medium text-gray-500">Role</p>
            <h3 class="text-xl font-bold text-gray-900 capitalize">{{ user.role.replace('_', ' ') }}</h3>
        </div>
    </div>
    
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex items-center">
        <div class="p-4 rounded-full bg-purple-50 text-purple-600 mr-4">
            <i data-lucide="calendar" class="w-8 h-8"></i>
        </div>
        <div>
            <p class="text-sm font-medium text-gray-500">Joined Date</p>
            <h3 class="text-xl font-bold text-gray-900">{{ user.joining_date }}</h3>
        </div>
    </div>
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="p-6 border-b border-gray-100">
        <h3 class="text-lg font-semibold text-gray-800">Quick Actions</h3>
    </div>
    <div class="p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
        
        <form action="/attendance/check-in" method="POST" class="w-full">
            <button type="submit" class="w-full py-4 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg flex flex-col items-center justify-center transition-colors">
                <i data-lucide="log-in" class="w-6 h-6 mb-2"></i>
                <span class="font-medium">Check In</span>
            </button>
        </form>
        
        <form action="/attendance/check-out" method="POST" class="w-full">
            <button type="submit" class="w-full py-4 bg-red-50 hover:bg-red-100 text-red-700 rounded-lg flex flex-col items-center justify-center transition-colors">
                <i data-lucide="log-out" class="w-6 h-6 mb-2"></i>
                <span class="font-medium">Check Out</span>
            </button>
        </form>
        
        <a href="/attendance" class="py-4 bg-gray-50 hover:bg-gray-100 text-gray-700 rounded-lg flex flex-col items-center justify-center transition-colors">
            <i data-lucide="list" class="w-6 h-6 mb-2"></i>
            <span class="font-medium">View Logs</span>
        </a>
        
        <a href="/payroll" class="py-4 bg-gray-50 hover:bg-gray-100 text-gray-700 rounded-lg flex flex-col items-center justify-center transition-colors">
            <i data-lucide="banknote" class="w-6 h-6 mb-2"></i>
            <span class="font-medium">Payslips</span>
        </a>
        
    </div>
</div>
{% endblock %}
