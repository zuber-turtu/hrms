# Company HRMS - Production Nginx Reverse Proxy Configuration
# Place in /etc/nginx/sites-available/hrms and symlink to /etc/nginx/sites-enabled/

# Rate limiting zone for authentication endpoints (prevents brute-force)
limit_req_zone $binary_remote_addr zone=hrms_auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=hrms_api_limit:10m rate=60r/m;

# Upstream pool connected to Gunicorn master process
upstream hrms_cluster {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# HTTP: Redirect all plain HTTP traffic to secure HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hrms.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: High-Performance Secure Application Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hrms.yourdomain.com;

    # SSL TLS Certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/hrms.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrms.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum file upload size (Resumes, PDF contracts, Employee photos)
    client_max_body_size 30M;

    # Gzip Compression for High-Throughput & Fast Page Loads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # 1. Directly Serve Static Files (Bypasses Python runtime completely)
    location /static/ {
        alias /var/www/hrms/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        log_not_found off;
    }

    # 2. Rate-limited Authentication & Token Endpoints
    location /auth/login {
        limit_req zone=hrms_auth_limit burst=5 nodelay;
        proxy_pass http://hrms_cluster;
        include /etc/nginx/proxy_params;
    }

    location /api/v1/auth/token {
        limit_req zone=hrms_api_limit burst=10 nodelay;
        proxy_pass http://hrms_cluster;
        include /etc/nginx/proxy_params;
    }

    # 3. Main Reverse Proxy to Gunicorn
    location / {
        proxy_pass http://hrms_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy PDF generation & exports
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
    }
}
